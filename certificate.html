<!DOCTYPE html>
<html lang="en-AE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate verification | DRIGO</title>
    <meta name="description" content="Check that a certificate issued by DRIGO is genuine: enter its number or scan its QR code.">
    <!-- Certificate pages carry people's names; keep them out of search results. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">

    <!-- Served at /certificate and /certificate/{number}: every URL here is absolute. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png?v=4">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png?v=4">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png?v=4">
    <link rel="mask-icon" href="/assets/svgs/favicon.svg" color="#4D21FF">
    <link rel="manifest" href="/site.webmanifest?v=4">

    <link rel="preload" href="/assets/fonts/Figtree.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/style.css?v=2">
    <link rel="stylesheet" href="/css/site.css?v=2">

    <style>
        /* Anyone who scans the QR code lands here, so the page only answers one question: is
           this certificate genuine? The result and the facts it was checked against, nothing to
           download or share. */
        :root { --cv-band: #f4f2fa; --cv-mono: ui-monospace, SFMono-Regular, Menlo, monospace; --cv-red: #b4232f; }
        body { background: #fff; font-family: var(--body); color: var(--ink); }
        .cv-mono { font-family: var(--cv-mono); letter-spacing: .02em; }
        .cv-inner { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

        /* Top bar */
        .cv-nav { border-bottom: 1px solid var(--line); }
        .cv-nav .cv-inner { height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .cv-logo { height: 30px; width: auto; display: block; }
        .cv-nav-label { font-size: 14px; font-weight: 600; color: var(--muted); }

        .btn-primary {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px;
            border: 0; border-radius: 999px; background: var(--violet); color: #fff; font: 600 15px/1 var(--body);
            cursor: pointer; white-space: nowrap; transition: background .3s var(--ease);
        }
        .btn-primary:hover { background: var(--violet-deep); }

        /* The result */
        .cv-result .cv-inner { max-width: 600px; padding-top: 64px; padding-bottom: 88px; text-align: center; }
        .cv-badge {
            width: 76px; height: 76px; margin: 0 auto 24px; border-radius: 50%; display: grid; place-items: center;
            background: var(--violet); color: #fff; box-shadow: 0 0 0 10px var(--lilac-soft);
        }
        .cv-badge svg { width: 36px; height: 36px; }
        .cv-result.is-revoked .cv-badge { background: var(--cv-red); box-shadow: 0 0 0 10px #fdecee; }
        .cv-result h1 { font-family: var(--body); font-weight: 700; font-size: 40px; line-height: 1.1; letter-spacing: -.02em; margin: 0 0 12px; }
        .cv-result.is-revoked h1 { color: var(--cv-red); }
        .cv-lead { margin: 0 auto; max-width: 440px; font-size: 16px; line-height: 1.6; color: var(--muted); text-wrap: balance; }
        .cv-details { margin: 36px 0 0; padding: 4px 24px; border: 1px solid var(--line); border-radius: 16px; text-align: left; }
        .cv-details > div { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; padding: 16px 0; }
        .cv-details > div + div { border-top: 1px solid var(--line); }
        .cv-details dt { font-size: 14px; line-height: 1.5; color: var(--muted); }
        .cv-details dd { margin: 0; font-size: 15px; line-height: 1.5; font-weight: 600; overflow-wrap: anywhere; }
        .cv-details dd span { display: block; font-weight: 400; color: var(--muted); }
        .cv-checked { margin: 16px 0 0; font-size: 13px; color: var(--muted); }
        .cv-again { display: inline-block; margin-top: 28px; font-size: 15px; font-weight: 600; color: var(--violet-deep); text-underline-offset: 4px; }

        /* Only the search: no number given, or the number was not found */
        .cv-start .cv-inner { max-width: 640px; padding-top: 72px; padding-bottom: 96px; text-align: center; }
        .cv-start-icon { width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 18px; display: grid; place-items: center; background: var(--lilac-soft); color: var(--violet); }
        .cv-start-icon svg { width: 32px; height: 32px; }
        .cv-start h1 { font-family: var(--body); font-weight: 700; font-size: 38px; line-height: 1.12; letter-spacing: -.02em; margin: 0 0 12px; }
        .cv-start p { margin: 0 auto; max-width: 460px; font-size: 16px; line-height: 1.6; color: var(--muted); }
        .cv-search { display: flex; gap: 10px; margin: 32px 0 0; }
        .cv-search input {
            flex: 1; min-width: 0; min-height: 56px; padding: 0 18px; border: 1px solid var(--line); border-radius: 999px;
            background: #fff; color: var(--ink); font: 500 16px/1 var(--cv-mono); letter-spacing: .04em; text-transform: uppercase; outline: none;
        }
        .cv-search input::placeholder { color: #b5b0c4; }
        .cv-search input:focus { border-color: var(--violet); }
        .cv-search .btn-primary { min-height: 56px; padding: 0 28px; }
        .cv-notice { margin: 24px 0 0; padding: 14px 18px; border-radius: 12px; background: var(--cv-band); font-size: 15px; line-height: 1.5; text-align: left; }
        .cv-notice strong { color: var(--cv-red); }

        .cv-footer { border-top: 1px solid var(--line); }
        .cv-footer .cv-inner { padding-top: 22px; padding-bottom: 28px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .cv-footer a { color: inherit; }

        .cv-loading { display: grid; place-items: center; padding: 120px 0; }
        .cv-spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--violet); animation: cv-spin .8s linear infinite; }
        @keyframes cv-spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .cv-inner { padding: 0 16px; }
            .cv-nav .cv-inner { height: 60px; }
            .cv-nav-label { font-size: 13px; }
            .cv-result .cv-inner { padding-top: 44px; padding-bottom: 64px; }
            .cv-result h1 { font-size: 34px; }
            .cv-details { padding: 4px 18px; }
            .cv-details > div { grid-template-columns: 1fr; gap: 2px; padding: 14px 0; }
            .cv-search { flex-direction: column; }
            .cv-start .cv-inner { padding-top: 44px; padding-bottom: 64px; }
            .cv-start h1 { font-size: 30px; }
        }
    </style>
</head>
<body>
    <header class="cv-nav">
        <div class="cv-inner">
            <a href="/" aria-label="DRIGO home"><img class="cv-logo" src="/assets/svgs/logo.svg" alt="DRIGO"></a>
            <span class="cv-nav-label">Certificate verification</span>
        </div>
    </header>

    <main id="cv-page" aria-live="polite">
        <div class="cv-loading"><div class="cv-spinner"></div></div>
    </main>

    <footer class="cv-footer">
        <div class="cv-inner">
            <span>Certificates are issued and verified by Drigo Car Rental LLC, Dubai, United Arab Emirates.</span>
            <a href="/">drigo.com</a>
        </div>
    </footer>

    <script>
    (function () {
        // The local preview runs against a mock of the API; drigo.com always uses the real one.
        var LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        var API = (LOCAL ? 'http://127.0.0.1:5191' : 'https://api.drigo.com') + '/api/landing/certificates/';

        var page = document.getElementById('cv-page');

        var ICONS = {
            check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
            cross: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
            award: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 13.9 7 22l5-3 5 3-1.5-8.1"/></svg>'
        };

        // Case, spaces and dashes do not matter, and DRG may be left out: "fe 2026 004" → DRG-FE-2026-004.
        function normalize(value) {
            var m = (value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').match(/^(?:DRG)?([A-Z]{2,5})(\d{4})(\d{3,4})$/);
            return m ? 'DRG-' + m[1] + '-' + m[2] + '-' + m[3] : (value || '').trim().toUpperCase();
        }

        // Dates arrive as yyyy-MM-dd; shown as "29 October 2026" whatever the visitor's time zone.
        function longDate(iso) {
            var p = iso.split('-');
            return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]))
                .toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
        }

        function el(tag, className, text) {
            var node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        function icon(name, node) {
            node.insertAdjacentHTML('afterbegin', ICONS[name]);
            return node;
        }

        // ── Search ──────────────────────────────────────────────────────────────────────

        function searchForm() {
            var form = el('form', 'cv-search');
            form.noValidate = true;
            var input = el('input');
            input.type = 'text';
            input.placeholder = 'DRG-FE-2026-004';
            input.setAttribute('aria-label', 'Certificate number');
            input.autocomplete = 'off';
            input.setAttribute('autocapitalize', 'characters');
            input.spellcheck = false;
            input.maxLength = 40;
            var button = el('button', 'btn-primary', 'Verify');
            button.type = 'submit';
            form.appendChild(input);
            form.appendChild(button);
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var number = normalize(input.value);
                if (!number) { input.focus(); return; }
                history.pushState(null, '', '/certificate/' + encodeURIComponent(number));
                load(number);
            });
            setTimeout(function () { input.focus(); }, 0);
            return form;
        }

        function showStart(problem) {
            document.title = 'Certificate verification | DRIGO';
            var section = el('section', 'cv-start');
            var inner = el('div', 'cv-inner');
            inner.appendChild(icon('award', el('div', 'cv-start-icon')));
            inner.appendChild(el('h1', null, 'Verify a Drigo certificate'));
            inner.appendChild(el('p', null, 'Enter the number printed at the bottom of the certificate, or scan its QR code with your phone camera.'));
            inner.appendChild(searchForm());
            if (problem) {
                var note = el('div', 'cv-notice');
                note.appendChild(el('strong', null, problem.title + ' '));
                note.appendChild(document.createTextNode(problem.text));
                inner.appendChild(note);
            }
            section.appendChild(inner);
            page.replaceChildren(section);
        }

        // ── Result ──────────────────────────────────────────────────────────────────────

        function detail(list, label, value, note) {
            var row = el('div');
            row.appendChild(el('dt', null, label));
            var dd = el('dd', null, value);
            if (note) dd.appendChild(el('span', null, note));
            row.appendChild(dd);
            list.appendChild(row);
            return dd;
        }

        function showResult(c) {
            var valid = c.status !== 'revoked';
            document.title = (valid ? 'Verified' : 'Not valid') + ' · ' + c.number + ' | DRIGO';

            var section = el('section', 'cv-result' + (valid ? '' : ' is-revoked'));
            var inner = el('div', 'cv-inner');
            inner.appendChild(icon(valid ? 'check' : 'cross', el('div', 'cv-badge')));
            inner.appendChild(el('h1', null, valid ? 'Verified' : 'Not valid'));
            inner.appendChild(el('p', 'cv-lead', valid
                ? 'This is a genuine certificate issued by Drigo Car Rental LLC.'
                : 'Drigo revoked this certificate on ' + longDate(c.revokedOn) + '. A printed copy of it no longer proves anything.'));

            var list = el('dl', 'cv-details');
            detail(list, 'Issued to', c.fullName);
            detail(list, 'Programme', c.programName, 'Certificate ' + c.subtitle.toLowerCase());
            detail(list, 'Issued on', longDate(c.issuedOn));
            if (!valid) detail(list, 'Revoked on', longDate(c.revokedOn));
            detail(list, 'Issued by', 'Drigo Car Rental LLC', c.city + ', United Arab Emirates');
            detail(list, 'Certificate number', c.number).className = 'cv-mono';
            inner.appendChild(list);

            inner.appendChild(el('p', 'cv-checked', 'Checked against Drigo’s records just now.'));
            var again = el('a', 'cv-again', 'Verify another certificate');
            again.href = '/certificate';
            inner.appendChild(again);

            section.appendChild(inner);
            page.replaceChildren(section);
        }

        // ── Loading ─────────────────────────────────────────────────────────────────────

        function load(number) {
            if (!number) { showStart(null); return; }
            page.innerHTML = '<div class="cv-loading"><div class="cv-spinner"></div></div>';
            window.scrollTo(0, 0);
            fetch(API + encodeURIComponent(number))
                .then(function (res) {
                    if (res.status === 404) return null;
                    if (!res.ok) throw new Error(res.status);
                    return res.json();
                })
                .then(function (c) {
                    if (c) showResult(c);
                    else showStart({ title: 'Not found.', text: 'No Drigo certificate has the number ' + number + '. Check it against the certificate.' });
                })
                .catch(function () {
                    showStart({ title: 'Could not check right now.', text: 'Please try again in a minute.' });
                });
        }

        // drigo.com/certificate/DRG-FE-2026-004 (what the QR code opens) or ?no=…
        function fromUrl() {
            var m = location.pathname.match(/^\/certificate\/([^/]+)/);
            return normalize(m ? decodeURIComponent(m[1]) : new URLSearchParams(location.search).get('no'));
        }

        window.addEventListener('popstate', function () { load(fromUrl()); });
        load(fromUrl());
    })();
    </script>
</body>
</html>
