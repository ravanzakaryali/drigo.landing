# Canonical host for the public landing site.
server {
    listen 80;
    server_name drigo.com www.drigo.com;
    return 301 https://drigo.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.drigo.com;
    return 301 https://drigo.com$request_uri;

    ssl_certificate /etc/letsencrypt/live/drigo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drigo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 443 ssl;
    server_name drigo.com;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/wwwroot/drigo.landing;
    index index.html;

    # Inspect the original request, so serving index.html internally cannot loop.
    if ($request_uri ~ "^/index[.]html([?]|$)") {
        return 301 https://drigo.com/$is_args$args;
    }
    if ($request_uri ~ "^/(privacy|privacy-ar)[.]html([?]|$)") {
        return 301 https://drigo.com/$1$is_args$args;
    }

    # Operational configuration is versioned here but is not public content.
    location ^~ /ops/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /business {
        return 301 /#business;
    }
    location = /business.html {
        return 301 /#business;
    }
    location = /privacy {
        try_files /privacy.html =404;
    }
    location = /privacy-ar {
        try_files /privacy-ar.html =404;
    }
    location = /exit-survey {
        try_files /exit-survey.html =404;
    }

    # Certificate QR links must continue to resolve to the verification page.
    location = /certificate {
        try_files /certificate.html =404;
    }
    location ^~ /certificate/ {
        try_files /certificate.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    ssl_certificate /etc/letsencrypt/live/drigo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drigo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
